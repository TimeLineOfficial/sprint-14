name: Automated CI/CD Pipeline (Sprint 14 Walking Skeleton)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-cd-sprint-14"
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # Stage 1: Static Analysis, Linting & Code Quality Audit
  # ==========================================================================
  lint-and-code-quality:
    name: "Stage 1: Lint & Code Quality Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Production & Test Dependencies
        run: npm install

      - name: Execute Static Linter
        run: npm run lint

  # ==========================================================================
  # Stage 2: Automated Unit Test Suite Execution (Mandatory Test Gate)
  # ==========================================================================
  test-suite-execution:
    name: "Stage 2: Test Suite Execution (Gate)"
    runs-on: ubuntu-latest
    needs: [lint-and-code-quality]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Test Suite (Auth, Middleware, Shipments, Telemetry)
        run: npm test

  # ==========================================================================
  # Stage 3: Automated Build & Production Artifact Packaging (Only if Tests Pass)
  # ==========================================================================
  build-and-deploy:
    name: "Stage 3: Production Build & Artifact Packaging"
    runs-on: ubuntu-latest
    needs: [lint-and-code-quality, test-suite-execution]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Build Script
        run: npm run build

      - name: Upload Production Edge Artifact
        uses: actions/upload-artifact@v4
        with:
          name: walking-skeleton-edge-build
          path: |
            public/
            server.js
            package.json
          retention-days: 14
